# =============================================================================
# ci.yml — Intégration continue de TaskFlow opérée (front + API)
# =============================================================================
# Appelle le workflow réutilisable pour chaque projet Node du repo.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  front:
    name: Front
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      working-directory: .
      artifact-name: front
      upload-artifact: true

  api:
    name: API
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      working-directory: api
      artifact-name: api
      coverage-threshold: 80

  # Bonus Bloc 1 : audit informatif (ne bloque pas)
  audit:
    name: 🔒 npm audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-project
      - name: Audit front
        run: npm audit --audit-level=high
      - name: Audit API
        working-directory: api
        run: npm ci && npm audit --audit-level=high
