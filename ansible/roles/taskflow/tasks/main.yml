---
# Rôle taskflow — releases immuables + bascule du lien current
#
#   /opt/taskflow/releases/<version>/{dist,api}
#   /opt/taskflow/current -> releases/<version>
#   /opt/taskflow/shared/api.env

- name: Paquets système (nginx, rsync, outils apt)
  ansible.builtin.apt:
    name:
      - nginx
      - curl
      - rsync
      - acl
      - ca-certificates
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Dossier keyrings apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Clé GPG NodeSource
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Source apt Node {{ node_major }}
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.list
    content: >
      deb [signed-by=/etc/apt/keyrings/nodesource.asc]
      https://deb.nodesource.com/node_{{ node_major }}.x nodistro main
    mode: "0644"

- name: Paquet nodejs
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Compte système {{ app_user }}
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_root }}"
    create_home: false

- name: Arborescence releases / shared / release courante
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  loop:
    - "{{ app_root }}"
    - "{{ app_root }}/releases"
    - "{{ app_shared }}"
    - "{{ app_release_dir }}"

- name: Sync du front (dist)
  ansible.posix.synchronize:
    src: "{{ app_dist_local }}/"
    dest: "{{ app_release_dir }}/dist/"
    delete: true
    recursive: true

- name: Sync de l'API (sans node_modules)
  ansible.posix.synchronize:
    src: "{{ app_api_local }}/"
    dest: "{{ app_release_dir }}/api/"
    delete: true
    recursive: true
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=reports"
      - "--exclude=coverage"
      - "--exclude=.env"

- name: Propriétaire de la release
  ansible.builtin.file:
    path: "{{ app_release_dir }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    recurse: true

- name: npm ci production (idempotent via creates)
  ansible.builtin.command:
    cmd: npm ci --omit=dev --no-audit --no-fund
    chdir: "{{ app_release_dir }}/api"
    creates: "{{ app_release_dir }}/api/node_modules"
  become_user: "{{ app_user }}"

- name: Fichier d'environnement partagé
  ansible.builtin.template:
    src: api.env.j2
    dest: "{{ app_shared }}/api.env"
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  notify: Restart taskflow-api

- name: Unité systemd taskflow-api
  ansible.builtin.template:
    src: taskflow-api.service.j2
    dest: /etc/systemd/system/taskflow-api.service
    mode: "0644"
  notify: Restart taskflow-api

- name: Lien symbolique current
  ansible.builtin.file:
    src: "{{ app_release_dir }}"
    dest: "{{ app_current }}"
    state: link
    force: true
  notify: Restart taskflow-api

- name: Service taskflow-api actif
  ansible.builtin.systemd:
    name: taskflow-api
    enabled: true
    state: started
    daemon_reload: true

- name: Vhost nginx
  ansible.builtin.template:
    src: nginx-taskflow.conf.j2
    dest: "/etc/nginx/sites-available/{{ app_name }}.conf"
    mode: "0644"
  notify: Reload nginx

- name: Activer le vhost
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ app_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ app_name }}.conf"
    state: link
  notify: Reload nginx

- name: Retirer le site default nginx
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: nginx démarré
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Présence de ufw
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: ufw_bin

- name: Ports HTTP + node_exporter (ufw)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ app_http_port }}"
    - "9100"
  when: ufw_bin.stat.exists

- name: Inventaire des dossiers de release
  ansible.builtin.find:
    paths: "{{ app_root }}/releases"
    file_type: directory
  register: releases_found

- name: Purge des anciennes releases (garde {{ keep_releases }})
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: >-
    {{
      (releases_found.files | sort(attribute='mtime'))[:-(keep_releases | int)]
      if (releases_found.files | length) > (keep_releases | int)
      else []
    }}
  loop_control:
    label: "{{ item.path }}"

- name: Flush handlers avant healthcheck playbook
  ansible.builtin.meta: flush_handlers
