---
# Défauts du rôle taskflow — surchargés par group_vars
app_name: taskflow
app_root: /opt/taskflow
app_user: taskflow
app_http_port: 80
app_server_name: _
app_env: local
api_port: 3000
api_secret: "change-me"
keep_releases: 5
node_major: 20

# Artefact extrait à la racine du workspace runner (dist/ + api/)
app_dist_local: "{{ playbook_dir }}/../../dist"
app_api_local: "{{ playbook_dir }}/../../api"

app_release_dir: "{{ app_root }}/releases/{{ app_version }}"
app_current: "{{ app_root }}/current"
app_shared: "{{ app_root }}/shared"
