---
# Binaire officiel Prometheus node_exporter + unit systemd
- name: Utilisateur système {{ node_exporter_user }}
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Version déjà installée ?
  ansible.builtin.command: "{{ node_exporter_bin }} --version"
  register: installed_ne
  changed_when: false
  failed_when: false

- name: Download archive v{{ node_exporter_version }}
  ansible.builtin.get_url:
    url: "{{ node_exporter_url }}"
    dest: "/tmp/{{ node_exporter_archive }}.tar.gz"
    mode: "0644"
  when: node_exporter_version not in ((installed_ne.stdout | default('')) + (installed_ne.stderr | default('')))

- name: Extraire l'archive
  ansible.builtin.unarchive:
    src: "/tmp/{{ node_exporter_archive }}.tar.gz"
    dest: /tmp
    remote_src: true
  when: node_exporter_version not in ((installed_ne.stdout | default('')) + (installed_ne.stderr | default('')))

- name: Installer le binaire dans {{ node_exporter_bin }}
  ansible.builtin.copy:
    src: "/tmp/{{ node_exporter_archive }}/node_exporter"
    dest: "{{ node_exporter_bin }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: node_exporter_version not in ((installed_ne.stdout | default('')) + (installed_ne.stderr | default('')))
  notify: Restart node_exporter

- name: Unit systemd
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: Restart node_exporter

- name: Activer node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: ufw présent ?
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: ufw_bin

- name: Autoriser le port {{ node_exporter_port }}
  community.general.ufw:
    rule: allow
    port: "{{ node_exporter_port }}"
    proto: tcp
  when: ufw_bin.stat.exists

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
