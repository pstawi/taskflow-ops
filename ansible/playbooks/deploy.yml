---
# Playbook de déploiement — l'artefact (dist + api) est déjà sur le contrôleur
- name: Déploiement TaskFlow
  hosts: web
  become: true
  gather_facts: true

  pre_tasks:
    - name: app_version obligatoire
      ansible.builtin.assert:
        that:
          - app_version is defined
          - (app_version | string | length) > 0
        fail_msg: "Utiliser -e app_version=<run_number>"

    - name: Contrôle présence du build front
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../dist/index.html"
      delegate_to: localhost
      become: false
      register: dist_check
      failed_when: not dist_check.stat.exists

  roles:
    - taskflow

  post_tasks:
    - name: Healthcheck local API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ api_port }}/health"
        return_content: true
      register: health_res
      retries: 5
      delay: 2
      until: health_res.status == 200

    - name: Version déployée
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} [{{ app_env }}] => {{ health_res.json }}"
