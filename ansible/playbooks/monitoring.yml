---
# Installe node_exporter sur staging + prod (scrape :9100 depuis Prometheus)
- name: Agents de monitoring
  hosts: web
  become: true
  gather_facts: true

  roles:
    - node_exporter

  post_tasks:
    - name: Smoke /metrics node_exporter
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
        return_content: true
      register: ne_metrics
      failed_when: "'node_cpu_seconds_total' not in ne_metrics.content"
