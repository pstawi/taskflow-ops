---
# Remet current sur une release déjà présente (pas de rebuild)
- name: Rollback TaskFlow
  hosts: web
  become: true
  gather_facts: false

  tasks:
    - name: rollback_to requis
      ansible.builtin.assert:
        that:
          - rollback_to is defined
          - (rollback_to | string | length) > 0
        fail_msg: "Utiliser -e rollback_to=<n>"

    - name: Existence de la release cible
      ansible.builtin.stat:
        path: "{{ app_root }}/releases/{{ rollback_to }}/api/src/server.js"
      register: target_release

    - name: Release introuvable
      ansible.builtin.fail:
        msg: "releases/{{ rollback_to }} absente sur {{ inventory_hostname }}"
      when: not target_release.stat.exists

    - name: Pointage de current
      ansible.builtin.file:
        src: "{{ app_root }}/releases/{{ rollback_to }}"
        dest: "{{ app_root }}/current"
        state: link
        force: true
      notify:
        - Restart taskflow-api
        - Reload nginx

    - name: APP_VERSION dans api.env
      ansible.builtin.lineinfile:
        path: "{{ app_root }}/shared/api.env"
        regexp: '^APP_VERSION='
        line: "APP_VERSION={{ rollback_to }}"
      notify: Restart taskflow-api

    - name: Appliquer restart immédiat
      ansible.builtin.meta: flush_handlers

    - name: Confirmer /health version
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ api_port }}/health"
        return_content: true
      register: health_res
      retries: 5
      delay: 2
      until: >-
        health_res.status == 200
        and (health_res.json.version | string) == (rollback_to | string)

  handlers:
    - name: Restart taskflow-api
      ansible.builtin.systemd:
        name: taskflow-api
        state: restarted

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
