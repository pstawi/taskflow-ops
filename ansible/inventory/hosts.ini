# Inventaire du lab TaskFlow opérée
# Deux environnements = deux VMs Multipass (cf. ressources/lab/lab-up.sh)

[staging]
taskflow-web1 ansible_host=192.168.1.25

[prod]
taskflow-web2 ansible_host=192.168.1.26

# Groupe parent : les rôles ciblent "web", les playbooks limitent avec -l staging|prod
[web:children]
staging
prod

[web:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/taskflow_lab
