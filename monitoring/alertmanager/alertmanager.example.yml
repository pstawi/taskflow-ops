# Gabarit Alertmanager (commité). Runtime = alertmanager.yml (gitignore).
global:
  resolve_timeout: 5m
  smtp_smarthost: mailhog:1025
  smtp_from: alerts@taskflow-ops.lab
  smtp_require_tls: false

route:
  receiver: mail
  group_by: [alertname, env]
  group_wait: 15s
  group_interval: 3m
  repeat_interval: 3h
  routes:
    - matchers: [alertname = Watchdog]
      receiver: nullsink
    # critical → Discord (CHANGE_ME) puis mail (continue)
    - matchers: [severity = critical]
      receiver: discord
      continue: true
    - matchers: [severity = critical]
      receiver: mail

receivers:
  - name: nullsink

  - name: mail
    email_configs:
      - to: oncall@taskflow-ops.lab
        send_resolved: true

  - name: discord
    discord_configs:
      - webhook_url: https://discord.com/api/webhooks/CHANGE_ME
        send_resolved: true
        title: 'TaskFlow {{ .CommonLabels.alertname }} / {{ .CommonLabels.env }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

inhibit_rules:
  - source_matchers: [severity = critical]
    target_matchers: [severity = warning]
    equal: [env]
