# Alertes + recording rules TaskFlow
# CI : job lint-monitoring → promtool check rules
groups:
  - name: taskflow_slo_recording
    interval: 30s
    rules:
      - record: job:http_requests:rate5m
        expr: sum by (env) (rate(http_requests_total{job="taskflow-api"}[5m]))

      - record: job:http_errors:ratio5m
        expr: >
          sum by (env) (rate(http_requests_total{job="taskflow-api",status_code=~"5.."}[5m]))
          / sum by (env) (rate(http_requests_total{job="taskflow-api"}[5m]))

  - name: taskflow_alerts
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Dead man's switch — alerting vivant"
          description: "Doit rester firing en permanence. Si elle disparaît, Prometheus ou Alertmanager est HS."

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Cible scrape absente ({{ $labels.job }})"
          description: "{{ $labels.instance }} ne répond plus au scrape depuis 1 min (env={{ $labels.env }})."
          runbook_url: https://github.com/pstawi/taskflow-ops/blob/main/docs/runbooks/InstanceDown.md

      - alert: TaskFlowApiDown
        expr: probe_success{job="blackbox"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API {{ $labels.env }} down (blackbox /health)"
          description: "probe_success=0 sur {{ $labels.instance }}. Check nginx + systemctl taskflow-api."
          runbook_url: https://github.com/pstawi/taskflow-ops/blob/main/docs/runbooks/TaskFlowApiDown.md

      - alert: HighErrorRate
        expr: job:http_errors:ratio5m > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }} : trop de 5xx"
          description: "Ratio erreurs = {{ $value | humanizePercentage }} (seuil 5 %, fenêtre 5 min)."
          runbook_url: https://github.com/pstawi/taskflow-ops/blob/main/docs/runbooks/HighErrorRate.md

      - alert: HighLatencyP95
        expr: >
          histogram_quantile(
            0.95,
            sum by (le, env) (rate(http_request_duration_seconds_bucket{job="taskflow-api"}[5m]))
          ) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }} : p95 au-delà du SLO"
          description: "p95 observé {{ $value | humanizeDuration }} (budget 300 ms)."
          runbook_url: https://github.com/pstawi/taskflow-ops/blob/main/docs/runbooks/HighLatencyP95.md

      - alert: HostHighCpu
        expr: >
          100 - (avg by (instance, env)
            (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU saturé sur {{ $labels.instance }}"
          description: "{{ $value | printf \"%.0f\" }} % CPU moyen sur 10 min ({{ $labels.env }})."
          runbook_url: https://github.com/pstawi/taskflow-ops/blob/main/docs/runbooks/HostHighCpu.md

      - alert: DiskWillFillIn4h
        expr: >
          predict_linear(
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint="/"}[1h],
            14400
          ) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Risque disque plein ({{ $labels.instance }})"
          description: "predict_linear prévoit mountpoint={{ $labels.mountpoint }} saturé sous 4 h."
          runbook_url: https://github.com/pstawi/taskflow-ops/blob/main/docs/runbooks/DiskWillFillIn4h.md
