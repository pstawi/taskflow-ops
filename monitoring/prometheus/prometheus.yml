# Collecte Prometheus — lab Multipass (IPs lues via `multipass list`)
# staging = taskflow-web1 | prod = taskflow-web2
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: taskflow-ops
    student: pstawi

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: node-local
    static_configs:
      - targets: [node-exporter:9100]
        labels: { env: lab, role: workstation }

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
        labels: { env: lab }

  - job_name: taskflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.0.37:80"]
        labels: { env: staging }
      - targets: ["192.168.0.36:80"]
        labels: { env: prod }

  - job_name: node-vms
    static_configs:
      - targets: ["192.168.0.37:9100"]
        labels: { env: staging }
      - targets: ["192.168.0.36:9100"]
        labels: { env: prod }

  # Sonde externe /health : la cible réelle devient __param_target
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://192.168.0.37/health
          - http://192.168.0.36/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        regex: http://192\.168\.0\.37.*
        target_label: env
        replacement: staging
      - source_labels: [__param_target]
        regex: http://192\.168\.0\.36.*
        target_label: env
        replacement: prod
