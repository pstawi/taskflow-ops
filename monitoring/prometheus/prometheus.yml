# =============================================================================
# prometheus.yml — configuration de collecte pour TaskFlow opérée (J3)
# =============================================================================
# Cibles (6) :
#   - prometheus (self)
#   - node-exporter local (poste)
#   - API TaskFlow staging + prod (:80/metrics via nginx)
#   - node_exporter VMs staging + prod (:9100)
#
# IPs lab : multipass list → 192.168.1.25 / .26
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: taskflow-lab

rule_files:
  - /etc/prometheus/rules/*.yml

# Alertmanager décommenté en J4 — section absente tant que le service n'est pas up
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-local
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          env: lab
          instance_name: poste-etudiant

  # API TaskFlow via nginx (:80/metrics)
  - job_name: taskflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.1.25:80']
        labels:
          env: staging
      - targets: ['192.168.1.26:80']
        labels:
          env: prod

  # node_exporter sur les VMs
  - job_name: node-vms
    static_configs:
      - targets: ['192.168.1.25:9100']
        labels:
          env: staging
      - targets: ['192.168.1.26:9100']
        labels:
          env: prod
